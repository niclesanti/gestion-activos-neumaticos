server {
    # nginx-unprivileged: corre sin root, así que escucha en un puerto alto.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (CSP incluida), generadas desde
    # scripts/security-headers.mjs en el build de la imagen. Se incluyen en cada
    # location porque un add_header propio de una location anula los heredados.
    include /etc/nginx/snippets/security-headers.conf;

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # index.html no se cachea, para que un deploy nuevo se vea de inmediato.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
