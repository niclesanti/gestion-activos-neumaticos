# Stack local. Variables en el .env raíz (ver .env.example). Lo que cambia en un
# despliegue real está en docs/despliegue-seguro.md.
#
# Los puertos se publican solo en 127.0.0.1: nada de este stack queda expuesto
# a la red local. pgAdmin no arranca por defecto:
#   docker compose --profile herramientas up -d pgadmin
services:
  backend:
    build:
      context: ./backend/gestion-neumaticos
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      # Solo la clave del rol sin privilegios gn_app: las migraciones las corre
      # el servicio "migraciones" y el backend nunca recibe credenciales con DDL.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      # Observabilidad: logs ECS en archivo (los lee Alloy) y etiqueta del ambiente.
      # El puerto de gestión 8081 (Actuator) no se publica: solo lo ve Alloy.
      APP_ENTORNO: ${APP_ENTORNO:-local}
      LOGGING_FILE_NAME: /logs/backend.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - logs-backend:/logs
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Tope de memoria del contenedor: la JVM dimensiona el heap como un 60 % de
    # este valor (Dockerfile). Si aparecen OutOfMemoryError, subirlo por .env.
    mem_limit: ${BACKEND_MEM_LIMIT:-640m}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      migraciones:
        condition: service_completed_successfully

  # Job de una sola ejecución: migra con el owner (no superusuario) y termina.
  migraciones:
    build:
      context: ./backend/gestion-neumaticos
      dockerfile: Dockerfile.migraciones
    # La clave de gn_app viaja como placeholder dentro de un string con dollar
    # quoting (afterMigrate__clave_rol_app.sql): se rechaza si contiene "$".
    entrypoint: ["sh", "-c"]
    command:
      - |
        case "$$FLYWAY_PLACEHOLDERS_APP_PASSWORD" in
          *'$$'*) echo "DB_APP_PASSWORD no puede contener '$$'" >&2; exit 1 ;;
        esac
        exec flyway migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      FLYWAY_USER: ${DB_OWNER_USER}
      FLYWAY_PASSWORD: ${DB_OWNER_PASSWORD}
      # Por defecto, solo las migraciones. En dev se suma el seed de usuarios
      # de prueba: filesystem:/flyway/sql/migraciones,filesystem:/flyway/sql/seed-dev
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-filesystem:/flyway/sql/migraciones}
      FLYWAY_PLACEHOLDERS_APP_PASSWORD: ${DB_APP_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 10
      # Sin telemetría de Redgate ni chequeo de versiones contra internet.
      REDGATE_DISABLE_TELEMETRY: "true"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/gestion-neumaticos
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3000:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

  postgres:
    image: postgres:18-alpine
    # La app usa un pool de 5 conexiones: 20 alcanzan (migraciones, pgAdmin y
    # las reservadas del superusuario incluidas) y cada una es un proceso.
    command: ["postgres", "-c", "max_connections=20"]
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    environment:
      POSTGRES_DB: ${DB_NAME}
      # Superusuario de la imagen: solo lo usa el script de initdb para crear
      # el owner. Ningún servicio de la aplicación se conecta con él.
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Para conectarse desde el IDE o psql locales.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: ["herramientas"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  # ── Observabilidad (docs/Obs&Tel/decisiones-observabilidad.md) ─────
  # Alloy es el único componente que también corre en la nube (profile
  # "observabilidad"); Prometheus, Loki y Grafana solo en local:
  #   docker compose --profile observabilidad-local up -d
  alloy:
    image: grafana/alloy:v1.22.0
    profiles: ["observabilidad", "observabilidad-local"]
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      APP_ENTORNO: ${APP_ENTORNO:-local}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-60s}
      METRICS_URL: ${METRICS_URL}
      METRICS_USER: ${METRICS_USER}
      LOGS_URL: ${LOGS_URL}
      LOGS_USER: ${LOGS_USER}
    secrets:
      - GRAFANA_CLOUD_TOKEN
    volumes:
      - ./infra/observabilidad/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - logs-backend:/logs:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    # Sin "ports": la UI de Alloy (12345) no se publica.

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observabilidad-local"]
    # Solo recibe lo que empuja Alloy (remote write); no hace scrape propio.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.10
    profiles: ["observabilidad-local"]
    # Configuración por defecto de la imagen (single binary, filesystem).
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["observabilidad-local"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # 3001: el 3000 es del frontend.
      - "127.0.0.1:3001:3000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki

# Fuente local del token de Grafana Cloud (valor de relleno en local). En la
# nube lo escribe el workflow de despliegue como archivo de secretos.
secrets:
  GRAFANA_CLOUD_TOKEN:
    environment: GRAFANA_CLOUD_TOKEN

volumes:
  postgres-data:
  pgadmin-data:
  logs-backend:
  alloy-data:
  prometheus-data:
  loki-data:
  grafana-data:
