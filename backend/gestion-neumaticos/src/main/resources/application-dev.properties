spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestion-neumaticos-db}
# La app se conecta con gn_app (sin privilegios propios) y en cada conexión
# asume el rol del usuario autenticado. El owner (no superusuario) solo lo usa
# Flyway. Con docker compose, Flyway lo corre el servicio "migraciones" y acá se
# deshabilita (SPRING_FLYWAY_ENABLED=false); desde el IDE migra la propia app.
spring.datasource.username=gn_app
spring.datasource.password=${DB_APP_PASSWORD:gn_app_dev}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.user=${DB_OWNER_USER:gn_owner}
spring.flyway.password=${DB_OWNER_PASSWORD:gn_owner_dev}
spring.flyway.placeholders.app_password=${DB_APP_PASSWORD:gn_app_dev}
# El seed de usuarios de prueba sólo se carga en dev.
spring.flyway.locations=classpath:db/migration,classpath:db/seed/dev

logging.level.ar.edu.utn.frsf.pfc.niclemeichtry.gestion_neumaticos=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Swagger UI y /api-docs habilitados explícitamente solo en dev (en prod se apagan).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
