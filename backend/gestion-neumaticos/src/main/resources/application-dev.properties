spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestion-neumaticos-db}
# La app se conecta con gn_app (sin privilegios propios) y en cada conexión
# asume el rol del usuario autenticado. El owner solo lo usa Flyway.
spring.datasource.username=gn_app
spring.datasource.password=${DB_APP_PASSWORD:gn_app_dev}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.user=${DB_USER:postgres}
spring.flyway.password=${DB_PASSWORD:postgres123}
spring.flyway.placeholders.app_password=${DB_APP_PASSWORD:gn_app_dev}
# El seed de usuarios de prueba sólo se carga en dev.
spring.flyway.locations=classpath:db/migration,classpath:db/seed/dev

logging.level.ar.edu.utn.frsf.pfc.niclemeichtry.gestion_neumaticos=DEBUG
logging.level.org.hibernate.SQL=DEBUG
