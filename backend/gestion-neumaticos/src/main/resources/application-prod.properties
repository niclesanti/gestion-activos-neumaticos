spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
# La app se conecta con gn_app (sin privilegios propios) y en cada conexión
# asume el rol del usuario autenticado. El owner solo lo usa Flyway.
spring.datasource.username=gn_app
spring.datasource.password=${DB_APP_PASSWORD}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.placeholders.app_password=${DB_APP_PASSWORD}
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.ar.edu.utn.frsf.pfc.niclemeichtry.gestion_neumaticos=INFO
