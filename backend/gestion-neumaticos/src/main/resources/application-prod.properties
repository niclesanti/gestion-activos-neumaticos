spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
# La app se conecta con gn_app (sin privilegios propios) y en cada conexión
# asume el rol del usuario autenticado.
spring.datasource.username=gn_app
spring.datasource.password=${DB_APP_PASSWORD}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# En prod las migraciones las corre un job aparte (servicio "migraciones" de
# compose.yaml) con el owner de la base: el backend nunca recibe sus credenciales.
spring.flyway.enabled=false

# Detrás del proxy que termina TLS (Cloudflare / reverse proxy): Tomcat toma la
# IP del cliente y el esquema https de X-Forwarded-*, pero solo si el request
# llega desde una red interna (server.tomcat.remoteip.internal-proxies por
# defecto). Sin esto, el límite de intentos vería una única IP y HSTS no se enviaría.
server.forward-headers-strategy=native
# La IP del cliente sale de CF-Connecting-IP, que Cloudflare siempre sobrescribe
# (el cliente no la puede falsificar, a diferencia de X-Forwarded-For). Detrás de
# otro proxy, cambiar CLIENT_IP_HEADER (p. ej. X-Forwarded-For) y acotar
# SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES a la IP o subred de ese proxy.
server.tomcat.remoteip.remote-ip-header=${CLIENT_IP_HEADER:CF-Connecting-IP}

# Sin documentación de la API expuesta en producción.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.ar.edu.utn.frsf.pfc.niclemeichtry.gestion_neumaticos=INFO
