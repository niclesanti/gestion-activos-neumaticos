spring.application.name=gestion-neumaticos

server.port=${SERVER_PORT:8080}
# No anunciar versiones en las páginas de error del contenedor.
server.error.include-stacktrace=never
server.error.include-message=never

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

# Sin Open Session In View: la conexión se devuelve al pool al terminar cada
# operación de datos y no al final del request (un request lento, como el hash
# del login, no retiene una conexión).
spring.jpa.open-in-view=false

# La tabla event_publication de Spring Modulith la crea Flyway
# (V6__crear_tabla_event_publication.sql): la app se conecta con un rol sin DDL.
spring.modulith.events.jpa.schema-initialization.enabled=false

app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Base64 de al menos 32 bytes aleatorios: openssl rand -base64 32
app.security.jwt.secret=${JWT_SECRET:}
# Vigencia del token de sesión. El frontend además cierra la sesión tras 30
# minutos de inactividad.
app.security.jwt.expiracion=PT2H

# Límite de intentos de login (ver LimiteLoginProperties).
app.security.login.intentos-por-ip=10
app.security.login.ventana-ip=PT1M
app.security.login.fallos-por-cuenta=5
app.security.login.ventana-cuenta=PT15M
