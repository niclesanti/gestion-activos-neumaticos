spring.application.name=gestion-neumaticos

server.port=${SERVER_PORT:8080}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

# La tabla event_publication de Spring Modulith la crea Flyway
# (V6__crear_tabla_event_publication.sql): la app se conecta con un rol sin DDL.
spring.modulith.events.jpa.schema-initialization.enabled=false

app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.security.jwt.secret=${JWT_SECRET:}
# Vigencia del token de sesión (un turno de trabajo).
app.security.jwt.expiracion=PT8H
