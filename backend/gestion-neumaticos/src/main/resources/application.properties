spring.application.name=gestion-neumaticos

server.port=${SERVER_PORT:8080}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

# Spring Modulith's JPA event publication registry needs its own table
# (event_publication). There are no Flyway migrations yet, so let Modulith
# create its schema itself instead of failing Hibernate's ddl-auto=validate.
spring.modulith.events.jpa.schema-initialization.enabled=true

app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.security.jwt-secret=${JWT_SECRET:}
